name: Release data bundles
# Manual-only: the web app that consumed these bundles was removed (APP-461).
on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:data
      - name: Upload bundles to R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          for cat in greenways deals parking; do
            if [ -f "dist/data/v1/$cat.json" ]; then
              npx --yes wrangler r2 object put "$R2_BUCKET/data/v1/$cat.json" --file="dist/data/v1/$cat.json" --content-type=application/json
            fi
          done
          if [ -f dist/data/manifest.json ]; then
            npx --yes wrangler r2 object put "$R2_BUCKET/data/manifest.json" --file=dist/data/manifest.json --content-type=application/json
          fi
